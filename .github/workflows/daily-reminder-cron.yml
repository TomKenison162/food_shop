name: Daily dinner reminder

# Runs hourly (GitHub Actions has no per-plan frequency limit, unlike
# Vercel's Hobby cron which is capped at once/day). The route no-ops until
# 17:00 Europe/London, which is what keeps the reminder correct across the
# GMT/BST switch without editing this expression twice a year. This is the
# primary trigger; vercel.json's daily cron is a backup.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send now, ignoring the 17:00 window (for testing)"
        type: boolean
        default: false

jobs:
  daily-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Tonight's dinner email
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::APP_URL and CRON_SECRET repository secrets must both be set."
            exit 1
          fi

          # A trailing slash produces host//api/... which Vercel answers with
          # a 308 canonicalisation redirect, so normalise it away first.
          APP_URL="${APP_URL%/}"

          url="${APP_URL}/api/cron/daily-reminder"
          if [ "${FORCE:-false}" = "true" ]; then
            url="${url}?force=1"
            echo "Forcing a send, ignoring the 17:00 Europe/London window."
          fi

          # Printed unconditionally so a failed run can never again be a
          # blank log. If this line is missing from the output, the step died
          # before it ran — which now only happens if GitHub is still using
          # an older version of this file than the one on the default branch.
          echo "Target: ${url}"

          # Deliberately NOT `curl -f`: -f ignores 3xx, so a redirect exited 0
          # and this job reported success while the endpoint never ran.
          #
          # Redirects ARE followed (-L), because harmless ones are normal here
          # (http->https, host canonicalisation). What matters is where we end
          # up: landing on an SSO or login page means the request was
          # intercepted, which is checked explicitly below. --max-redirs caps
          # any loop.
          # Captured with command substitution, NOT `read a b < <(curl ...)`.
          # curl's -w output has no trailing newline, so read hit EOF and
          # returned 1 — which under `set -e` killed the step before the
          # first echo. The job failed hourly with no output at all while the
          # endpoint itself was being called successfully every time.
          if ! out="$(
            curl -sS -L --max-redirs 5 -o response.txt \
              -w '%{http_code} %{url_effective}' \
              --max-time 60 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "$url"
          )"; then
            echo "::error::curl could not reach ${url} (network error or timeout)."
            exit 1
          fi

          status="${out%% *}"
          effective_url="${out##* }"

          echo "HTTP ${status}"
          echo "final URL: ${effective_url}"
          echo "--- response body ---"
          cat response.txt || true
          echo

          # curl drops the Authorization header on a cross-HOST redirect (a
          # deliberate curl safety behaviour), which would surface as a
          # confusing 401 rather than the real cause. Catch it explicitly.
          original_host="$(printf '%s' "$url" | awk -F/ '{print $3}')"
          final_host="$(printf '%s' "$effective_url" | awk -F/ '{print $3}')"
          if [ "$original_host" != "$final_host" ]; then
            echo "::error::Redirected from ${original_host} to ${final_host}, which drops the auth header. \
          Set the APP_URL secret to https://${final_host} (the canonical production domain)."
            exit 1
          fi

          case "$effective_url" in
            *sso*|*/login*)
              echo "::error::Request was intercepted and ended at ${effective_url} — it never reached the app. \
          Disable Vercel Deployment Protection (Settings > Deployment Protection > Vercel Authentication)."
              exit 1
              ;;
          esac

          case "$status" in
            2*)
              echo "Reminder endpoint ran."
              ;;
            3*)
              echo "::error::Redirected (HTTP ${status}) — the request never reached the app. \
          This is usually Vercel Deployment Protection; disable it under \
          Settings > Deployment Protection, or check APP_URL points at the stable production domain."
              exit 1
              ;;
            401|403)
              echo "::error::Rejected (HTTP ${status}) — CRON_SECRET here does not match the one set in Vercel."
              exit 1
              ;;
            *)
              echo "::error::Unexpected HTTP ${status} from the reminder endpoint."
              exit 1
              ;;
          esac
